version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Lint and type-check bumps often need code changes; keep them apart.
      lint-tools:
        patterns: ["ruff", "ty"]
      test-harness:
        patterns: ["pytest-homeassistant-custom-component"]
    ignore:
      # Capped on purpose; see the comment in requirements-dev.txt.
      - dependency-name: "pytest-homeassistant-custom-component"
        versions: [">=0.13.368"]
      # Runtime deps follow manifest.json, not this bot.
      - dependency-name: "smartthings-local"
      - dependency-name: "cbor2"
      - dependency-name: "pyOpenSSL"
      - dependency-name: "cryptography"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
