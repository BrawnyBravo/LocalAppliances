version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Lint and type-check bumps often need code changes; keep them apart.
      lint-tools:
        patterns: ["ruff", "ty"]
    ignore:
      # Capped on purpose and lifted by hand; see the comment in
      # requirements-dev.txt. Dependabot also cannot rewrite the capped range.
      - dependency-name: "pytest-homeassistant-custom-component"
      # Runtime deps follow manifest.json, not this bot.
      - dependency-name: "smartthings-local"
      - dependency-name: "cbor2"
      - dependency-name: "pyOpenSSL"
      - dependency-name: "cryptography"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
