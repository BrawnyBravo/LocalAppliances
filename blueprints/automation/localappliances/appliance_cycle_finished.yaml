blueprint:
  name: Appliance cycle finished
  description: >-
    Run actions when a washer, dryer or dishwasher added through
    LocalAppliances finishes its cycle. Pick the appliance's "Cycle" event
    entity, then what should happen (for example a phone notification).
    LocalAppliances is not affiliated with Samsung or SmartThings.
  domain: automation
  source_url: https://github.com/BrawnyBravo/LocalAppliances/blob/main/blueprints/automation/localappliances/appliance_cycle_finished.yaml
  input:
    cycle_event:
      name: Cycle event
      description: Pick the appliance's Cycle entity (an event entity ending in "Cycle").
      selector:
        entity:
          filter:
            - integration: localthings
              domain: event
    finished_actions:
      name: Actions
      description: What to do when the cycle finishes.
      selector:
        action: {}

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input cycle_event

conditions:
  # Skip the entity becoming available/unavailable; only real events.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable']
         and trigger.to_state.state not in ['unavailable', 'unknown']
         and trigger.from_state.state != trigger.to_state.state
         and trigger.to_state.attributes.event_type == 'finished' }}

actions: !input finished_actions
